# Full stack: research API + Qdrant + Redis (+ optional Ollama, Prometheus, Grafana)
#   docker compose up --build
#   docker compose --profile local-llm --profile monitoring up --build
services:
  research-api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      QDRANT_MODE: server
      QDRANT_HOST: qdrant
      REDIS_HOST: redis
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      qdrant: { condition: service_healthy }
      redis:  { condition: service_healthy }
    volumes:
      - model_cache:/root/.cache/huggingface
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]
    command: redis-server --save 60 1 --loglevel warning
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_models:/root/.ollama]
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.52.0
    ports: ["9090:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:10.4.2
    ports: ["3000:3000"]
    volumes: [grafana_data:/var/lib/grafana]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  prometheus_data:
  grafana_data:
  model_cache:
  app_data:
  ollama_models:
